<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monkey Fruit Catch</title>
    <meta
      name="description"
      content="Catch falling fruit in your basket across five escalating stages — but one fruit each stage costs you."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Monkey Fruit Catch</h1>
      <div id="game-root">
        <canvas id="game-canvas"></canvas>

        <div id="hud" hidden>
          <span id="hud-stage"></span>
          <span id="hud-score"></span>
          <span id="hud-time"></span>
        </div>

        <div id="popup-layer" aria-hidden="true"></div>

        <section id="start-screen" class="overlay">
          <div class="overlay-card">
            <p class="title-emoji">🍌🍎🍇🍊🍐</p>
            <button id="start-btn" type="button" autofocus>START GAME</button>
          </div>
        </section>

        <section id="stage-intro" class="overlay" hidden>
          <div class="overlay-card">
            <p id="stage-intro-heading" class="overlay-heading"></p>
            <dl class="result-stats">
              <div><dt>Bonus fruit</dt><dd id="stage-intro-bonus"></dd></div>
              <div><dt>Penalty fruit</dt><dd id="stage-intro-penalty"></dd></div>
            </dl>
            <button id="begin-stage-btn" type="button">START STAGE</button>
          </div>
        </section>

        <section id="stage-result" class="overlay" hidden>
          <div class="overlay-card">
            <p id="stage-result-heading" class="overlay-heading"></p>
            <dl class="result-stats">
              <div><dt>Stage score</dt><dd id="stage-result-score"></dd></div>
              <div><dt>Total score</dt><dd id="stage-result-total"></dd></div>
            </dl>
            <button id="next-stage-btn" type="button">NEXT STAGE</button>
          </div>
        </section>

        <section id="final-result" class="overlay" hidden>
          <div class="overlay-card">
            <p class="overlay-heading">GAME COMPLETE!</p>
            <p id="final-score" class="final-score"></p>
            <dl id="final-breakdown" class="result-stats"></dl>
            <p id="final-extra"></p>
            <button id="play-again-btn" type="button">PLAY AGAIN</button>
          </div>
        </section>

        <div id="touch-controls" aria-hidden="true">
          <button id="touch-left" type="button" tabindex="-1" aria-hidden="true">◀</button>
          <button id="touch-right" type="button" tabindex="-1" aria-hidden="true">▶</button>
        </div>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
